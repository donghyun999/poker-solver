# push / PR마다 엔진 테스트 + 프론트엔드 빌드 + 앱 백엔드 컴파일 확인
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # app 크레이트는 webkit이 필요해 아래 app 잡에서 따로 확인
      - run: cargo test --workspace --exclude app

  # 엔진 API가 바뀌어 앱 백엔드가 깨지면 릴리스 태그 전에 여기서 잡힌다
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri 리눅스 의존성
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      # 프론트 빌드 결과(app/dist)가 있어야 백엔드가 컴파일된다 (tauri.conf.json frontendDist)
      - working-directory: app
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p app
