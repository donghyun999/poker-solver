# 릴리스: v* 태그를 push하면 Windows / macOS(Apple Silicon, Intel) / Linux 설치 파일을 빌드해
# GitHub Release(초안)에 첨부한다. 초안을 확인한 뒤 GitHub에서 "Publish"를 누르면 공개된다.
#
#   1) 버전 올리기: app/src-tauri/tauri.conf.json 의 "version"
#   2) git tag v0.2.0 && git push origin v0.2.0
#
# 공개 저장소로 배포하기 (이 저장소가 private일 때):
#   - 저장소 Variables에 RELEASE_OWNER = "donghyun999", RELEASE_REPO = "poker-solver-releases"
#   - 저장소 Secrets에 RELEASE_TOKEN = 그 저장소에 contents:write 권한이 있는 PAT
#   설정하지 않으면 이 저장소의 Releases에 올라간다.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 태그와 앱 버전 일치 확인
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app=$(jq -r .version app/src-tauri/tauri.conf.json)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::태그 v$tag 와 tauri.conf.json 버전 $app 이 다릅니다"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust-target: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 시스템 라이브러리
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.rust-target }}

      - name: 프론트엔드 의존성
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Poker Solver ${{ github.ref_name }}"
          releaseBody: |
            ## 설치
            - Windows: `.msi` 또는 `-setup.exe`
            - macOS: Apple Silicon은 `aarch64.dmg`, Intel은 `x64.dmg`
            - Linux: `.AppImage`, `.deb`, `.rpm`

            코드 서명 전이라 첫 실행 시 경고가 뜰 수 있습니다.
            Windows: "추가 정보 → 실행". macOS: 시스템 설정 → 개인정보 보호 및 보안 → "확인 없이 열기".
          releaseDraft: true
          prerelease: false
          # 비어 있으면 tauri-action이 현재 저장소를 쓴다
          owner: ${{ vars.RELEASE_OWNER }}
          repo: ${{ vars.RELEASE_REPO }}
